[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-automation"
version = "0.1.0"
description = "Discover once with an LLM, replay forever: computer-use automation for legacy bank UIs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Computer-Use Automation" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "playwright>=1.49",
  "openai>=1.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
cuas = "cuas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuas = ["profiles/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
